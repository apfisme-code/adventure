# Поддерживаются только числовые (numeric) и булевы (boolean) статусы.
# Для числовых указываются min, max, default.
# Для булевых — только default (true/false).
statuses:
  богатство:
    type: numeric
    min: 0
    max: 10
    default: 0
  известность:
    type: numeric
    min: 0
    max: 10
    default: 0
  мудрость:
    type: numeric
    min: 0
    max: 10
    default: 0
  красноречие:
    type: numeric
    min: 0
    max: 10
    default: 1
  фехтование:
    type: boolean
    default: false
  взлом:
    type: boolean
    default: false
  проклят:
    type: boolean
    default: false