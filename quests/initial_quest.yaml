id: "initial_quest"
name: "Путь к славе"
description: "Докажи свою ценность, набрав известность или богатство."
conditions:
  - status: "известность"
    operator: ">="
    value: 3
  # Альтернативно можно использовать OR, но пока просто AND.
# Если условий несколько – все должны выполняться.
on_complete:
  # После завершения квеста можем добавить новый квест
  add_quest: "cursed_quest"   # добавляем проклятие
  status_changes:
    известность: 2   # бонус
    богатство: 1