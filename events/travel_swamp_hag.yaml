text: "На болоте вы встречаете старую ведьму, которая варит зелье."
is_goal_event: false
tags:
  - travel
  - болото
requires: []
choices:
  - text: "Попросить у неё зелье"
    requires: []
    outcomes:
      - text: "Зелье оказалось ядом, вы чуть не умерли."
        success_level: fail
        status_changes: {"мудрость": -1}
      - text: "Она дала зелье от усталости."
        success_level: neutral
        status_changes: {"мудрость": 1}
      - text: "Зелье придало вам силы, вы совершили подвиг."
        success_level: success
        status_changes: {"известность": 2, "фехтование": true}   # получаете навык
  - text: "Украсть у неё книгу заклинаний"
    requires: [{"взлом": "==true"}]
    outcomes:
      - text: "Ведьма поймала вас и превратила в лягушку."
        success_level: fail
        status_changes: {"взлом": false}   # потеря навыка
      - text: "Вы украли книгу, но она на непонятном языке."
        success_level: neutral
        status_changes: {"мудрость": 1}
      - text: "В книге вы нашли карту сокровищ!"
        success_level: success
        status_changes: {"богатство": 3, "взлом": true}   # подтверждение навыка
  - text: "Вызвать её на состязание в мудрости"
    requires: [{"мудрость": ">=4"}]
    outcomes:
      - text: "Ведьма задала неразрешимую загадку, вы проиграли."
        success_level: fail
        status_changes: {"мудрость": -1}
      - text: "Вы ответили правильно, но ведьма ушла."
        success_level: neutral
        status_changes: {"мудрость": 1}
      - text: "Вы превзошли ведьму, она открыла вам тайный вход."
        success_level: success
        status_changes: {"мудрость": 2, "известность": 1, "взлом": true}  # получаете навык