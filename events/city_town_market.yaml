text: "Шумный рынок. Торговцы зазывают покупателей, а в толпе мелькают странные личности."
is_goal_event: false
tags:
  - city
  - небольшой город
choices:
  - text: "Купить древний свиток у старьёвщика"
    outcomes:
      - text: "Свиток оказался подделкой, вас обманули."
        success_level: fail
      - text: "Свиток содержал бесполезные записи, но вы не расстроились."
        success_level: neutral
      - text: "Это была карта сокровищ! Вы нашли клад и стали богаты."
        success_level: success
        goal_achieved: wealth
  - text: "Помочь торговцу, у которого украли кошелёк"
    outcomes:
      - text: "Вы погнались за вором, но потеряли его из виду."
        success_level: fail
      - text: "Вы догнали вора и вернули кошелёк, торговец поблагодарил."
        success_level: neutral
      - text: "Вор оказался вождём местной гильдии, и ваше имя прогремело после этой истории!"
        success_level: success
        goal_achieved: fame
  - text: "Завести разговор с таинственным незнакомцем"
    outcomes:
      - text: "Он оказался шпионом и попытался вас завербовать, вы отказались."
        success_level: neutral
      - text: "Он рассказал вам о странных событиях в городе, но это было неинтересно."
        success_level: neutral
      - text: "Он пригласил вас в экспедицию в неизведанные земли – ждут великие приключения!"
        success_level: success
        goal_achieved: adventure