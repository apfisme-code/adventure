text: "Вы заходите в шумную таверну. За стойкой бармен, а в углу сидит подозрительный тип."
is_goal_event: false
tags:
  - city
  - небольшой город
choices:
  - text: "Заказать самое дорогое вино"
    outcomes:
      - text: "Вино оказалось кислым, и вы потратили деньги зря."
        success_level: fail
      - text: "Вино было приятным, вы хорошо провели время."
        success_level: neutral
      - text: "Бармен рассказал вам секрет, как разбогатеть, и вы последовали его совету!"
        success_level: success
        goal_achieved: wealth
  - text: "Подсесть к подозрительному типу"
    outcomes:
      - text: "Он оказался опасным бандитом, вы едва спаслись."
        success_level: fail
      - text: "Он рассказал вам городские сплетни, ничего полезного."
        success_level: neutral
      - text: "Он оказался переодетым разведчиком и предложил вам участие в захватывающем приключении!"
        success_level: success
        goal_achieved: adventure
  - text: "Помочь бармену с разбитой посудой"
    outcomes:
      - text: "Вы разбили ещё больше посуды, бармен рассердился."
        success_level: fail
      - text: "Вы помогли, но бармен лишь кивнул в знак благодарности."
        success_level: neutral
      - text: "Бармен оказался бывшим воином и научил вас приёму, который прославит вас!"
        success_level: success
        goal_achieved: fame