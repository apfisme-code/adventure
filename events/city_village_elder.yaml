text: "Старейшина деревни созывает собрание. Он ищет смельчака для опасного поручения."
is_goal_event: false
tags:
  - city
  - деревня
requires: []
choices:
  - text: "Вызваться добровольцем"
    requires: [{"фехтование": "==true"}]   # нужно уметь фехтовать
    outcomes:
      - text: "Вы не справились и подвели всех."
        success_level: fail
        status_changes: {"известность": -1}
      - text: "Вы выполнили задание, но без особой благодарности."
        success_level: neutral
        status_changes: {}
      - text: "Вы блестяще справились, и деревня прославила вас!"
        success_level: success
        status_changes: {"известность": 2}
  - text: "Отказаться, но предложить помощь советом"
    requires: [{"мудрость": ">=2"}]
    outcomes:
      - text: "Старейшина обиделся и прогнал вас."
        success_level: fail
        status_changes: {"мудрость": -1}
      - text: "Ваш совет оказался полезным, вас похвалили."
        success_level: neutral
        status_changes: {"мудрость": 1}
      - text: "Ваш план привёл к победе, и вы получили долю сокровищ!"
        success_level: success
        status_changes: {"богатство": 3}
  - text: "Тайком уйти, не участвуя"
    requires: [{"взлом": "==true"}]
    outcomes:
      - text: "Вас заметили и объявили трусом."
        success_level: fail
        status_changes: {"известность": -1}
      - text: "Никто не обратил внимания."
        success_level: neutral
        status_changes: {}
      - text: "Вы наткнулись на заброшенный склад с картой."
        success_level: success
        status_changes: {"взлом": false}   # потеряли навык? (или оставить true)