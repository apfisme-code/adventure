      - text: "Вы спокойно переночевали, утром продолжили путь."
        success_level: neutral
      - text: "Во сне к вам пришёл дух пустыни и открыл секрет вечной славы – ваше имя будет жить вечно!"
        success_level: success
        goal_achieved: fame