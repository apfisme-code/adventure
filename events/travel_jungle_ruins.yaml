    outcomes:
      - text: "Ваш план оказался неточным, и вы потеряли время."
        success_level: fail
      - text: "План пригодился местным археологам, вас поблагодарили."
        success_level: neutral
      - text: "Ваша карта стала известна во всём мире, ваше имя прославилось!"
        success_level: success
        goal_achieved: fame
